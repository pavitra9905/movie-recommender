<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Recommender</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>🎬 Movie Recommender</h1>
    <p>Pick a movie you like, set your preferences, and get similar picks.</p>
  </header>

  <main>
    <form id="filters">
      <label class="wide">Movie you like
        <input id="title" type="text" list="title-suggestions"
               placeholder="e.g. Inception" autocomplete="off">
        <datalist id="title-suggestions"></datalist>
      </label>

      <label>Genres <small>(Ctrl+click for several)</small>
        <select id="genres" multiple size="6"></select>
      </label>

      <div class="fields">
        <label>Min rating
          <input id="min-rating" type="number" min="0" max="10" step="0.1" placeholder="7.5">
        </label>
        <label>From year
          <input id="min-year" type="number" min="1900" max="2100" placeholder="2000">
        </label>
        <label>To year
          <input id="max-year" type="number" min="1900" max="2100" placeholder="2025">
        </label>
        <label>Max runtime (min)
          <input id="max-runtime" type="number" min="1" placeholder="150">
        </label>
        <label>Results
          <select id="limit">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </label>
      </div>

      <button type="submit">Recommend</button>
    </form>

    <p id="status" role="status"></p>
    <section id="results" class="grid"></section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
